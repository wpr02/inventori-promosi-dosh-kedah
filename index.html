<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Inventori DOSH Kedah</title>
    <style>
        :root { --primary: #003366; --accent: #27ae60; --admin: #8e44ad; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 480px; }
        .header { text-align: center; cursor: pointer; margin-bottom: 15px; }
        #clock { background: #eee; padding: 8px; border-radius: 8px; font-weight: bold; font-size: 13px; margin: 10px 0; text-align: center; }
        .alert { background: #fff5f5; border-left: 5px solid #e74c3c; padding: 15px; border-radius: 10px; margin-bottom: 15px; display: none; width: 100%; max-width: 480px; box-sizing: border-box; }
        
        #imageContainer { width: 100%; text-align: center; margin: 15px 0; display: none; min-height: 160px; }
        #itemImage { max-width: 180px; max-height: 180px; border-radius: 12px; border: 3px solid #eee; padding: 5px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); background: #fff; object-fit: contain; }

        label { display: block; margin: 15px 0 5px; font-weight: bold; color: var(--primary); font-size: 14px; }
        select, input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; margin-bottom: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; transition: 0.3s; }
        .btn-user { background: var(--accent); }
        #adminPanel { display: none; background: #fef9ff; padding: 20px; border-radius: 15px; margin-top: 25px; border: 2px dashed var(--admin); }
        
        .download-box { background: #fff; border: 1px solid #ddd; padding: 15px; border-radius: 10px; margin-top: 10px; }
        .btn-download { background: #e67e22; }
    </style>
</head>
<body>

    <div id="alertBox" class="alert">
        <h4 style="margin:0; color:#e74c3c;">⚠️ STOK RENDAH (<=2):</h4>
        <ul id="lowStockList" style="margin:5px 0; font-size:13px;"></ul>
    </div>

    <div class="container">
        <div class="header" onclick="toggleAdmin()">
            <h2 style="color:var(--primary); margin:0;">DOSH KEDAH</h2>
            <div id="clock">Memuatkan masa...</div>
        </div>

        <div id="userForm">
            <label>Nama Pengambil:</label>
            <select id="userName"><option>Sila tunggu...</option></select>
            <label>Seksyen:</label>
            <select id="userSection"><option>Sila tunggu...</option></select>
            <label>Pilih Barang:</label>
            <select id="itemSelect" onchange="tukarGambar()"><option>Sila tunggu...</option></select>

            <div id="imageContainer">
                <img id="itemImage" src="" alt="Pratonton Barang">
            </div>

            <label>Kuantiti Ambil:</label>
            <input type="number" id="qty" value="1" min="1">
            <button class="btn-user" id="btnUser" onclick="prosesStok('tolak')">REKOD PENGAMBILAN</button>
        </div>

        <div id="adminPanel">
            <h3 style="color:var(--admin); text-align:center;">🔐 Mod Admin</h3>
            <label>Barang (Restock):</label>
            <select id="itemAdmin"></select>
            <label>Kuantiti Masuk:</label>
            <input type="number" id="qtyAdmin" value="10">
            <button onclick="prosesStok('tambah')" style="background:var(--admin)">TAMBAH STOK</button>
            
            <hr>
            
            <label>Laporan Emel (Bulan Semasa):</label>
            <input type="email" id="adminEmail" placeholder="nama@dosh.gov.my">
            <button onclick="janaLaporan()" style="background:#34495e;">HANTAR KE EMEL</button>
            
            <hr>

            <div class="download-box">
                <h4 style="margin:0 0 10px 0; color:#d35400;">📊 Muat Turun Laporan CSV</h4>
                <div style="display: flex; gap: 5px;">
                    <select id="selMonth" style="padding: 8px;">
                        <option value="0">Januari</option>
                        <option value="1">Februari</option>
                        <option value="2">Mac</option>
                        <option value="3">April</option>
                        <option value="4">Mei</option>
                        <option value="5">Jun</option>
                        <option value="6">Julai</option>
                        <option value="7">Ogos</option>
                        <option value="8">September</option>
                        <option value="9">Oktober</option>
                        <option value="10">November</option>
                        <option value="11">Disember</option>
                    </select>
                    <select id="selYear" style="padding: 8px;"></select>
                </div>
                <button class="btn-download" onclick="muatTurunLaporanCustom()">MUAT TURUN CSV</button>
            </div>
        </div>
        <div id="status" style="text-align:center; font-size:12px; margin-top:15px; color:#888;">Sedia.</div>
    </div>

    <script>
        // GANTIKAN URL DI BAWAH DENGAN URL WEB APP TERKINI ANDA
        const API_URL = "https://script.google.com/macros/s/AKfycbwR56IldN-_qpB7GvOqFWkQwd2O40zuW5VhmhC_uLn2yGLhCVquONmrn3o2yZBVrAb2/exec";
        const ADMIN_PASS = "1234"; 
        let dataStokGlobal = [];
        let dataLogGlobal = [];

        function updateClock() {
            const kini = new Date();
            document.getElementById('clock').innerHTML = kini.toLocaleString('ms-MY', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }
        setInterval(updateClock, 1000);

        function setupYearSelect() {
            const yearSelect = document.getElementById('selYear');
            const currentYear = new Date().getFullYear();
            for(let i = currentYear; i >= 2024; i--) {
                yearSelect.add(new Option(i, i));
            }
            document.getElementById('selMonth').value = new Date().getMonth();
        }

        async function loadData() {
            setupYearSelect();
            try {
                const res = await (await fetch(API_URL)).json();
                dataStokGlobal = res.stok;
                dataLogGlobal = res.log || []; 
                
                isiSelect('userName', res.kakitangan);
                isiSelect('userSection', res.seksyen);
                
                const itemSelect = document.getElementById('itemSelect');
                const itemAdmin = document.getElementById('itemAdmin');
                itemSelect.innerHTML = itemAdmin.innerHTML = '<option value="">-- Pilih Barang --</option>';
                
                res.stok.slice(1).forEach(row => {
                    if(row[1]) {
                        itemSelect.add(new Option(`${row[1]} (Baki: ${row[2]})`, row[1]));
                        itemAdmin.add(new Option(row[1], row[1]));
                    }
                });
                
                let low = res.stok.slice(1).filter(r => r[2] <= 2 && r[1]);
                if(low.length > 0) {
                    document.getElementById('alertBox').style.display = 'block';
                    document.getElementById('lowStockList').innerHTML = low.map(r => `<li>${r[1]} (Baki: ${r[2]})</li>`).join('');
                }
            } catch (e) { document.getElementById('status').innerText = "Ralat data!"; }
        }

        function muatTurunLaporanCustom() {
            if (dataLogGlobal.length <= 1) return alert("Tiada data log ditemui.");
            
            const targetMonth = parseInt(document.getElementById('selMonth').value);
            const targetYear = parseInt(document.getElementById('selYear').value);
            
            let filteredLogs = dataLogGlobal.slice(1).filter(row => {
                // Logik pembersihan tarikh untuk menyokong format PG/PTG
                let rawDateStr = row[0].toString().replace(/PG/gi, 'AM').replace(/PTG/gi, 'PM');
                let d = new Date(rawDateStr);
                
                // Jika masih Invalid Date, ambil bahagian tarikh sahaja sebelum koma
                if (isNaN(d.getTime())) {
                    d = new Date(row[0].toString().split(',')[0]);
                }
                
                return d.getMonth() === targetMonth && d.getFullYear() === targetYear;
            });

            if (filteredLogs.length === 0) return alert("Tiada rekod ditemui untuk bulan/tahun yang dipilih.");

            let csvContent = "data:text/csv;charset=utf-8,Tarikh,Nama,Seksyen,Barang,Kuantiti,Baki Asal,Baki Baru\n";
            filteredLogs.forEach(row => {
                csvContent += row.join(",") + "\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Laporan_DOSH_${targetMonth+1}_${targetYear}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function tukarGambar() {
            const selectedItem = document.getElementById('itemSelect').value;
            const imgContainer = document.getElementById('imageContainer');
            const imgTag = document.getElementById('itemImage');
            const itemFound = dataStokGlobal.find(row => row[1] === selectedItem);
            
            if (itemFound && itemFound[3]) { 
                let rawLink = itemFound[3];
                if(rawLink.includes("drive.google.com")) {
                    const fileId = rawLink.split('/d/')[1].split('/')[0];
                    rawLink = `https://drive.google.com/uc?export=view&id=${fileId}`;
                }
                imgTag.src = rawLink;
                imgContainer.style.display = 'block';
            } else {
                imgContainer.style.display = 'none';
            }
        }

        function isiSelect(id, data) {
            const el = document.getElementById(id);
            el.innerHTML = '<option value="">-- Pilih --</option>';
            data.forEach(d => el.add(new Option(d, d)));
        }

        function toggleAdmin() {
            if(prompt("Katalaluan Admin:") === ADMIN_PASS) document.getElementById('adminPanel').style.display = 'block';
        }

        async function hantarData(data) {
            document.getElementById('status').innerText = "Memproses...";
            try {
                const r = await fetch(API_URL, { method: "POST", body: JSON.stringify(data) });
                alert(await r.text());
                location.reload();
            } catch (e) { alert("Gagal!"); }
        }

        async function prosesStok(jenis) {
            const payload = {
                type: jenis,
                userName: jenis === 'tambah' ? 'ADMIN' : document.getElementById('userName').value,
                userSection: jenis === 'tambah' ? 'PENGURUSAN' : document.getElementById('userSection').value,
                itemName: document.getElementById(jenis === 'tambah' ? 'itemAdmin' : 'itemSelect').value,
                quantity: document.getElementById(jenis === 'tambah' ? 'qtyAdmin' : 'qty').value
            };
            if(!payload.itemName || !payload.quantity) return alert("Lengkapkan maklumat!");
            await hantarData(payload);
        }

        async function janaLaporan() {
            const email = document.getElementById('adminEmail').value;
            if(!email) return alert("Masukkan emel!");
            await hantarData({ action: "jana_laporan", emailPenerima: email });
        }

        loadData();
    </script>
</body>
</html>
